name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Commit of Silo-Server/silo-plugins whose update-catalog tool builds the
  # repository index Silo servers read.
  SILO_PLUGINS_REF: 79d8dc98f3d2ab08e94108a1d8a1370b39d38482

jobs:
  build:
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Check the manifest version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(jq -r .version manifest.json)
          if [ "$got" != "$want" ]; then
            echo "manifest.json version is $got, tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build plugin binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOWORK: off
          # The app key of WeTrakr's Silo app. It is public: every request
          # sends it in a header.
          WETRAKR_CLIENT_ID: ${{ vars.WETRAKR_CLIENT_ID }}
        run: |
          if [ -z "$WETRAKR_CLIENT_ID" ]; then
            echo "Set the WETRAKR_CLIENT_ID repository variable."
            exit 1
          fi
          mkdir -p dist
          binary="plugin-${GOOS}-${GOARCH}"
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X github.com/wetrakr/wetrakr-silo/provider.DefaultClientID=${WETRAKR_CLIENT_ID}" \
            -o "dist/${binary}" .
          checksum=$(sha256sum "dist/${binary}" | awk '{print $1}')
          printf '%s  %s\n' "$checksum" "$binary" > "dist/checksums-${GOOS}-${GOARCH}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/plugin-* release/
          cat artifacts/checksums-*.txt | sort -u > release/checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/plugin-linux-amd64
            release/plugin-linux-arm64
            release/plugin-darwin-arm64
            release/checksums.txt
          generate_release_notes: true

  catalog:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Add the release to the repository index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -f manifest.json ] || echo '{"plugins":[]}' > manifest.json
          go run "github.com/Silo-Server/silo-plugins/cmd/update-catalog@${SILO_PLUGINS_REF}" \
            -repo "${GITHUB_REPOSITORY}" -tag "${GITHUB_REF_NAME}" -manifest manifest.json

      - name: Publish
        run: |
          git config user.name "wetrakr"
          git config user.email "277372706+wetrakr@users.noreply.github.com"
          git add manifest.json
          git commit -m "catalog: ${GITHUB_REF_NAME}" || exit 0
          git push origin gh-pages
